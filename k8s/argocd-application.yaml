apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whit-chess
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rock824/Whut-The-Chess.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: whit-chess
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
