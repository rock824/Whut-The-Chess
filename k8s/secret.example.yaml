apiVersion: v1
kind: Secret
metadata:
  name: whit-chess-secrets
  namespace: whit-chess
type: Opaque
stringData:
  postgres-password: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  database-url: postgresql://whit_chess:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres.whit-chess.svc.cluster.local:5432/whit_chess
  session-secret: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  registration-code: REPLACE_WITH_A_PRIVATE_FAMILY_INVITE_CODE
