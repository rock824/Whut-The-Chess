apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whit-chess-postgres
  namespace: whit-chess
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: whit-chess
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: whit-chess-postgres
  template:
    metadata:
      labels:
        app: whit-chess-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: whit_chess
            - name: POSTGRES_USER
              value: whit_chess
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: whit-chess-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U whit_chess -d whit_chess"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U whit_chess -d whit_chess"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: whit-chess-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: whit-chess
spec:
  selector:
    app: whit-chess-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
