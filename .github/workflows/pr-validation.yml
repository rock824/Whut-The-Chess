name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The existing tests use only Node.js built-ins; no dependencies to install.
      - name: Run JavaScript tests
        run: npm test
